name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          ./build/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration '${{ matrix.configuration }}' *> bin/build.log
          if ($LASTEXITCODE -ne 0) { Get-Content bin/build.log -Tail 80; exit 1 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r tests/requirements.txt
      - name: Test native editor
        run: |
          python -m pytest --executable './bin/VS2022/${{ matrix.configuration }}_${{ matrix.architecture }}/Notepad2.exe' --architecture '${{ matrix.architecture }}' --configuration '${{ matrix.configuration }}' --junitxml bin/test-results.xml *> bin/tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content bin/tests.log -Tail 100; exit 1 }
          Get-Content bin/tests.log
      - name: Package portable release
        if: matrix.configuration == 'Release'
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'itlezy/notepad2-mod' }}
        run: |
          $architecture = '${{ matrix.architecture }}'
          $tag = $env:RELEASE_TAG
          if ($env:AUTO_RELEASE -eq 'true') {
            $version = (Get-Item "bin/VS2022/Release_$architecture/Notepad2.exe").VersionInfo.FileVersion.Trim()
            $tag = "v$version-rc.1"
          }
          ./build/package.ps1 -Architecture $architecture -Tag $tag
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: executable-${{ matrix.configuration }}-${{ matrix.architecture }}
          path: bin/VS2022/${{ matrix.configuration }}_${{ matrix.architecture }}/Notepad2.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.configuration == 'Release'
        with:
          name: release-package-${{ matrix.architecture }}
          path: bin/packages/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{ matrix.configuration }}-${{ matrix.architecture }}
          path: |
            bin/*.log
            bin/test-results.xml
          retention-days: 14
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.repository == 'itlezy/notepad2-mod' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-*
          merge-multiple: true
          path: bin/packages
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $packages = 'bin/packages'
          if ($env:RELEASE_TAG) {
            ./build/publish-release.ps1 -Tag $env:RELEASE_TAG -PackageDirectory $packages
          } else {
            $x64 = @(Get-ChildItem $packages -File -Filter '*-x64.zip')
            if ($x64.Count -ne 1 -or $x64[0].Name -notmatch '^Notepad2-mod-(v\d+\.\d+\.\d+\.\d+-rc\.1)-x64\.zip$') {
              throw 'Expected one versioned x64 prerelease package.'
            }
            ./build/publish-release.ps1 -Tag $Matches[1] -PackageDirectory $packages -CreateTag
          }
